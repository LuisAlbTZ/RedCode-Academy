version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: redcode_db_pytests
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: redcode_academy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - redcode_network
    restart: unless-stopped
    # Se agrega healthcheck para evitar errores de conexión al arrancar las pruebas
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d redcode_academy" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redcode_app_pytests
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/redcode_academy
    depends_on:
      db:
        condition: service_healthy
    networks:
      - redcode_network
    volumes:
      - .:/app
    restart: unless-stopped

  # Nuevo servicio para proveer el navegador Chrome de forma aislada
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: redcode_selenium
    ports:
      - "4444:4444"
      - "7900:7900" # Opcional: Puerto VNC (http://localhost:7900) para ver las pruebas en vivo
    networks:
      - redcode_network
    restart: unless-stopped
    shm_size: 2g # Previene bloqueos por falta de memoria compartida en Chrome

volumes:
  postgres_data:

networks:
  redcode_network:
    driver: bridge

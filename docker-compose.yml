version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: redcode_db_pytests
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: redcode_academy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - redcode_network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redcode_app_pytests
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/redcode_academy
    depends_on:
      - db
    networks:
      - redcode_network
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  redcode_network:
    driver: bridge
